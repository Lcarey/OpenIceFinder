name: Refresh Rangers forecast

on:
  schedule:
    - cron: "20 6 * * *"
  workflow_dispatch:

concurrency:
  group: refresh-rangers
  cancel-in-progress: false

permissions:
  contents: read
  id-token: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - name: Scrape Elite 9 from the GitHub runner
        run: npm run refresh:rangers
      - uses: aws-actions/configure-aws-credentials@v5
        with:
          role-to-assume: arn:aws:iam::342206308993:role/OpenIceFinderGitHubRangersRefresh
          role-session-name: openice-rangers-refresh
          aws-region: us-east-1
      - name: Publish rangers.json
        env:
          BUCKET: openicefinderstack-webbucket12880f5b-q4mot9fj5rou
          DISTRIBUTION: E1W550PA7KZ48B
        run: |
          aws s3 cp data/rangers.json "s3://$BUCKET/data/rangers.json" \
            --content-type "application/json; charset=utf-8" \
            --cache-control "public, max-age=60"
          aws cloudfront create-invalidation --distribution-id "$DISTRIBUTION" --paths /data/rangers.json

  rankings:
    if: github.ref == 'refs/heads/main'
    runs-on: macos-15
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: npx playwright install chrome
      - name: Retrieve previous MYHockey snapshot
        run: |
          code=$(curl -sS -o /tmp/mhr-previous.json -w '%{http_code}' https://dtwj09ada0yt7.cloudfront.net/data/mhr.json)
          if [ "$code" = 200 ] && jq -e '.version == 1 and (.teams | type == "array")' /tmp/mhr-previous.json > /dev/null; then
            cp /tmp/mhr-previous.json data/mhr.json
          elif [ "$code" != 404 ] && [ "$code" != 403 ]; then
            echo "Could not read previous MHR snapshot; refusing to overwrite it."
            exit 1
          fi
      - name: Refresh MYHockey once for both pages
        id: mhr
        continue-on-error: true
        env:
          MHR_BROWSER_HEADED: "1"
          MHR_BROWSER_CHANNEL: chrome
        run: npm run refresh:mhr
      - uses: aws-actions/configure-aws-credentials@v5
        with:
          role-to-assume: arn:aws:iam::342206308993:role/OpenIceFinderGitHubRangersRefresh
          role-session-name: openice-mhr-refresh
          aws-region: us-east-1
      - name: Publish shared rankings cache
        run: |
          jq -e '.version == 1 and (.teams | length > 0)' data/mhr.json > /dev/null
          aws s3 cp data/mhr.json s3://openicefinderstack-webbucket12880f5b-q4mot9fj5rou/data/mhr.json --content-type "application/json; charset=utf-8" --cache-control "public, max-age=60"
          aws cloudfront create-invalidation --distribution-id E1W550PA7KZ48B --paths /data/mhr.json
      - name: Report a failed source refresh after preserving the cache
        if: steps.mhr.outcome == 'failure'
        run: exit 1
